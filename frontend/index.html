<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayFlow AI — Repayment Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="ledger">

  <aside class="stub">
    <div class="stub__mark">PayFlow<span>AI</span></div>
    <p class="stub__tag">Loan repayment ledger, grounded in the Sita Fintech model.</p>

    <dl class="stub__facts">
      <dt>Sector</dt><dd>Fintech — loan repayment</dd>
      <dt>Channels</dt><dd>mpesa · bank · ussd</dd>
      <dt>Rule</dt><dd>AI never writes the ledger. Every entry is validated and recorded by deterministic backend logic.</dd>
    </dl>

    <p class="stub__status" id="apiStatus">Checking backend…</p>
  </aside>

  <div class="tear" aria-hidden="true"></div>

  <main class="sheet">

    <section class="entry" aria-labelledby="repaymentHeading">
      <h1 id="repaymentHeading">New repayment entry</h1>
      <form id="repaymentForm" novalidate>
        <div class="row">
          <label for="accountId">Loan account ID</label>
          <input type="text" id="accountId" name="accountId" placeholder="a1111111-0000-0000-0000-000000000001" autocomplete="off">
        </div>
        <div class="row">
          <label for="amount">Amount (KES)</label>
          <input type="number" id="amount" name="amount" placeholder="5000" min="0" step="0.01">
        </div>
        <div class="row">
          <label>Channel</label>
          <div class="channels">
            <label class="chip"><input type="radio" name="channel" value="mpesa" checked> M-Pesa</label>
            <label class="chip"><input type="radio" name="channel" value="bank"> Bank</label>
            <label class="chip"><input type="radio" name="channel" value="ussd"> USSD</label>
          </div>
        </div>
        <button type="submit" id="submitBtn">Record repayment</button>
      </form>

      <div class="result" id="repaymentResult" hidden></div>
    </section>

    <hr class="rule">

    <section class="lookup" aria-labelledby="lookupHeading">
      <h2 id="lookupHeading">Look up a transaction</h2>
      <form id="lookupForm" novalidate>
        <div class="row row--inline">
          <input type="text" id="lookupId" name="transactionId" placeholder="Transaction ID" autocomplete="off">
          <button type="submit">Look up</button>
        </div>
      </form>

      <div class="lookup-result" id="lookupResult" hidden></div>

      <button type="button" id="explainBtn" hidden>Ask watsonx.ai to explain this</button>
      <div class="explanation" id="explanation" hidden></div>
    </section>

  </main>
</div>

<script src="js/app.js"></script>
</body>
</html>
